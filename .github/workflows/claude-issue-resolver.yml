name: Claude Code Issue Solver

on:
  issues:
    types: [labeled]

jobs:
  solve-issue:
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code & Open PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          BRANCH_NAME="claude/issue-${ISSUE_NUMBER}"

          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

          claude -p "You are a Senior Software Engineer with extensive industry experience, focused on writing minimalist, clean, simple, and testable code grounded in SOLID principles.

          You are tasked with resolving GitHub Issue #${ISSUE_NUMBER}:
          Title: ${ISSUE_TITLE}
          Description:
          ${ISSUE_BODY}

          Follow this strict workflow:
          1. Context & Architecture: Read \`CLAUDE.md\` and \`ARCHITECTURE.md\` (if present) first to understand project conventions, structure, and constraints.
          2. Tests: if the project has a test suite, write failing tests BEFORE changing behavior. This project currently has none, so do not invent a test framework; follow the definition of done in \`CLAUDE.md\`.
          3. Minimalist Implementation: Implement the simplest, cleanest change, strictly adhering to existing project patterns. Avoid over-engineering.
          4. Verification: Run \`npm run lint\` and \`npm run build\`. Both must pass with zero errors.
          5. Git & Pull Request:
             - Create atomic, well-structured commits following Conventional Commits (e.g., \`test: ...\`, \`feat: ...\`, \`fix: ...\`) on branch \`${BRANCH_NAME}\`.
             - Push the branch to origin.
             - Open a Pull Request targeting \`master\` referencing \`#${ISSUE_NUMBER}\` (e.g., \`Closes #${ISSUE_NUMBER}\`).
             - Leave the Pull Request open for human review. Do NOT merge or close it." \
          --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(npm:*),Bash(npx:*)" \
          --max-turns 35

          # Fallback check: notify on the issue if no PR was opened
          PR_URL=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')

          if [ -n "$PR_URL" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Pull Request opened for review: ${PR_URL}"
          else
            gh issue comment "$ISSUE_NUMBER" --body "Claude Code finished running on branch \`${BRANCH_NAME}\`, but no Pull Request was created. Please check the workflow logs."
          fi