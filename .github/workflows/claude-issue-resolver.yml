name: Claude Code Issue Solver

on:
  issues:
    types: [labeled]

jobs:
  solve-issue:
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          BRANCH_NAME="claude/issue-${ISSUE_NUMBER}"

          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

          claude -p "You are a Senior Software Engineer with extensive industry experience, focused on writing minimalist, clean, simple, and testable code grounded in SOLID principles.

          You are tasked with resolving GitHub Issue #${ISSUE_NUMBER}:
          Title: ${ISSUE_TITLE}
          Description:
          ${ISSUE_BODY}

          Follow this strict workflow:
          1. Context & Architecture: Read \`CLAUDE.md\` and \`ARCHITECTURE.md\` (if present) first to understand project conventions, structure, and constraints.
          2. Tests: if the project has a test suite, write failing tests BEFORE changing behavior. This project currently has none, so do not invent a test framework; follow the definition of done in \`CLAUDE.md\`.
          3. Minimalist Implementation: Implement the simplest, cleanest change, strictly adhering to existing project patterns. Avoid over-engineering.
          4. Verification: Run \`npm run lint\` and \`npm run build\`. Both must pass with zero errors.
          5. Git:
             - Create atomic, well-structured commits following Conventional Commits (e.g., \`feat: ...\`, \`fix: ...\`, \`docs: ...\`) on the current branch \`${BRANCH_NAME}\`.
             - Do NOT push and do NOT open a Pull Request. The workflow does that after you finish." \
          --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(npm:*),Bash(npx:*)" \
          --max-turns 35

      # Pushing and opening the PR happen here, outside Claude, so any failure
      # stops the job with a visible error instead of being swallowed.
      - name: Push branch & open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH_NAME="claude/issue-${ISSUE_NUMBER}"

          COMMITS=$(git rev-list --count "origin/${BASE_BRANCH}..HEAD")
          if [ "$COMMITS" = "0" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Claude Code finished but made no commits, so there is nothing to open a Pull Request for. Please check the workflow logs."
            exit 1
          fi

          # The bot owns this branch: overwrite results from earlier runs
          git push --force origin "$BRANCH_NAME"

          PR_URL=$(gh pr list --head "$BRANCH_NAME" --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            {
              echo "Closes #${ISSUE_NUMBER}"
              echo
              echo "Automated change by Claude Code."
              echo
              echo "## Commits"
              git log --format='- %s' "origin/${BASE_BRANCH}..HEAD"
            } > pr-body.md

            if ! PR_URL=$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH_NAME" --title "$ISSUE_TITLE" --body-file pr-body.md 2>&1); then
              echo "::error::gh pr create failed: ${PR_URL}"
              {
                echo "Branch \`${BRANCH_NAME}\` was pushed, but the Pull Request could not be created:"
                echo
                echo '```'
                echo "$PR_URL"
                echo '```'
                echo
                echo "If it says GitHub Actions is not permitted to create pull requests, enable it in Settings > Actions > General > Workflow permissions."
              } > fail-comment.md
              gh issue comment "$ISSUE_NUMBER" --body-file fail-comment.md
              exit 1
            fi
          fi

          gh issue comment "$ISSUE_NUMBER" --body "Pull Request opened for review: ${PR_URL}"
